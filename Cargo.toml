# =============================================================================
#  R E P S   ·   lower-lang
# =============================================================================
[package]
name    = "lower-lang"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Lowers lossless syntax trees into HIR through declarative semantic archetypes and hygienic templates."

# Keywords (5 max)
keywords = ["lowering", "hir", "compiler", "language", "lexersketch"]

# Categories
categories = ["compilers", "development-tools", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/lower-lang"
repository    = "https://github.com/jamesgober/lower-lang"
documentation = "https://docs.rs/lower-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "lower_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# The standard library. Without it the crate is `no_std` and needs only `alloc`.
std = ["hir-lang/std", "syntax-lang/std", "intern-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# The input: a lossless syntax tree, generic over the language's kind type `K`.
# Its `Span` (span-lang 0.4) is the same type hir-lang's origins carry.
syntax-lang = { version = "1", default-features = false }
# The output: HIR. Lowering builds it with hir-lang's `Builder`, records one
# expansion per template instantiation, and validates with `finish_lenient`.
hir-lang = { version = "0.3", default-features = false }
# Names: HIR names are `intern_lang::Symbol`s of the session's interner, which
# the caller passes in so names line up with the rest of the front end.
intern-lang = { version = "1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
# The worked example language in the tests, example, and benchmarks is forged
# from an `.lsf` schematic by lang-forge (registry dev-dependency, never a path).
lang-forge = "1.0.1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
